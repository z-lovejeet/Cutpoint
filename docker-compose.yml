services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cutpoint-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./backend/src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cutpoint-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - .env.example
    depends_on:
      - backend
    restart: unless-stopped
